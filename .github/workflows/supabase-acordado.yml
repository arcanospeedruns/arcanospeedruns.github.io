# Mantém o projeto do hub no Supabase acordado.
# No plano grátis, o Supabase pausa o projeto depois de uma semana sem uso.
# Este fluxo faz uma leitura simples nos posts a cada 3 dias (a mesma que qualquer visitante faz),
# usando o endereço e a chave pública que já estão em src/hub-config.js.
name: supabase-acordado
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutucar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lê os posts do hub
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' src/hub-config.js)
          CHAVE=$(grep -oP 'chave:\s*"\K[^"]+' src/hub-config.js)
          codigo=$(curl -sS -o resposta.json -w "%{http_code}" "$URL/rest/v1/posts?select=id&limit=1" -H "apikey: $CHAVE")
          echo "Supabase respondeu $codigo"
          cat resposta.json; echo
          test "$codigo" = "200"
