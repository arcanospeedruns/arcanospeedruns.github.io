# Gera o site com o Eleventy, confere os links internos e publica no GitHub Pages.
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Gera as imagens de compartilhamento de cada página
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 ferramentas/og.py _site
      - name: Confere links internos
        run: python3 ferramentas/conferir_links.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
